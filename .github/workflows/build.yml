name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      geckoview_version:
        description: "Version de GeckoView (vacio = ultima estable)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El runner ya trae el Android SDK; solo aceptamos las licencias
      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Resolver version de GeckoView
        env:
          INPUT_VERSION: ${{ github.event.inputs.geckoview_version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VER="$INPUT_VERSION"
          else
            VER=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-armeabi-v7a/maven-metadata.xml \
              | grep -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' \
              | sed -E 's/<[^>]+>//g' | sort -V | tail -n 1)
          fi
          echo "GeckoView: $VER"
          test -n "$VER"
          sed -i "s/^geckoviewVersion=.*/geckoviewVersion=$VER/" gradle.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleArmDebug assembleAarch64Debug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TVNavegador-APK
          path: app/build/outputs/apk/**/*.apk