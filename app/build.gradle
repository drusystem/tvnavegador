plugins {
    id 'com.android.application'
    // AGP 9 trae Kotlin integrado: ya no se aplica org.jetbrains.kotlin.android
}

android {
    namespace 'com.tvdonghua.browser'
    // GeckoView 159 exige API 37.2 (version menor del SDK 37)
    compileSdk {
        version = release(37) { it.minorApiLevel = 2 }
    }

    defaultConfig {
        applicationId "com.tvdonghua.browser"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.8"
    }

    // Solo 32 bits (armeabi-v7a): es el ABI del stick.
    flavorDimensions "abi"
    productFlavors {
        arm {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    armImplementation "org.mozilla.geckoview:geckoview-armeabi-v7a:${geckoviewVersion}"
}
