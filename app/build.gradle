plugins {
    id 'com.android.application'
    // AGP 9 trae Kotlin integrado: ya no se aplica org.jetbrains.kotlin.android
}

android {
    namespace 'com.tvdonghua.browser'
    compileSdk 37

    defaultConfig {
        applicationId "com.tvdonghua.browser"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Dos APK: una para TV box de 32 bits (la mas comun) y otra de 64 bits
    flavorDimensions "abi"
    productFlavors {
        arm {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
        aarch64 {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    armImplementation "org.mozilla.geckoview:geckoview-armeabi-v7a:${geckoviewVersion}"
    aarch64Implementation "org.mozilla.geckoview:geckoview-arm64-v8a:${geckoviewVersion}"
}
